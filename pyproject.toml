[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careerlens-ai"
version = "0.1.0"
description = "Explainable resume-to-job alignment analysis"
requires-python = ">=3.11"
dependencies = ["streamlit==1.50.0", "scikit-learn==1.7.2", "PyMuPDF==1.26.5", "python-docx==1.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

